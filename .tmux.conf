# ~/.tmux.conf
# Requires tmux 3.2+ for terminal-features and OSC 52 integration.

##### Terminal
set -g default-terminal 'tmux-256color'
set -as terminal-features ',xterm*:RGB:clipboard,wezterm*:RGB:clipboard'
set -g focus-events on
set -g escape-time 0
set -g history-limit 100000
set -g renumber-windows on
set -g base-index 1
setw -g pane-base-index 1

##### Mouse / Keys
set -g mouse on
setw -g mode-keys vi
set -g repeat-time 300
bind m if-shell -F '#{mouse}' \
  'set -g mouse off; display-message "Mouse: off"' \
  'set -g mouse on; display-message "Mouse: on"'

##### Prefix & Panes
unbind C-b
set -g prefix C-a
bind C-a send-prefix

bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

bind S set -w synchronize-panes \; display-message 'Sync: #{?pane_synchronized,on,off}'

##### Clipboard (native OSC 52)
# Copies reach the *attached terminal's* clipboard if it supports OSC 52.
# No pbcopy/wl-copy/xclip required; works over SSH with compatible terminals.
set -s set-clipboard on
unbind -T copy-mode-vi y
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-selection-and-cancel
bind p paste-buffer

# Send latest tmux buffer to the terminal's clipboard on demand.
bind C-y run-shell 'tmux save-buffer - | tmux load-buffer -w -'

##### Popup
# Global Ctrl-G is intentional; it takes this key away from applications.
bind -n C-g display-popup -w 80% -h 60% -E 'tmux new-session -A -s popup'

##### Status
set -g status-interval 2
set -g status-justify left
set -g status-bg black
set -g status-fg green
set -g status-left-length 48
set -g status-left '#[fg=yellow]#S #[fg=green]| #{?client_prefix,#[fg=black,bg=yellow] PREFIX #[default],}'
set -g status-right '#H %H:%M:%S %d-%b-%Y'
set -g window-status-current-format '#[fg=black,bg=green] #I:#W '
set -g window-status-format '#[fg=cyan,bg=black] #I:#W '
setw -g automatic-rename on
setw -g automatic-rename-format '#{b:pane_current_command}'

##### Borders
set -g pane-border-status top
set -g pane-border-format '#{pane_index} #{?pane_title,#{pane_title},#{b:pane_current_command}}'
set -g pane-active-border-style 'fg=yellow,bg=black'

##### Switchers
bind Space choose-tree -Zw
bind f command-prompt -p 'Find session/window:' "switch-client -t '%%'"
bind Enter command-prompt -I 'new' -p 'New session name:' "new-session -s '%%'"
bind N command-prompt -p 'New window name:' "new-window -n '%%'"

##### Quality of life
bind z resize-pane -Z
bind X confirm-before -p 'Kill pane #P?' 'kill-pane'
bind W confirm-before -p 'Kill window #I:#W?' 'kill-window'
bind r source-file ~/.tmux.conf \; display-message 'tmux reloaded'
set -g allow-rename off
set -g detach-on-destroy off
